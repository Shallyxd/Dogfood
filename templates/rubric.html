{% extends "base.html" %}

{% block title %}Rubric Weights — DOGFOOD 2026{% endblock %}

{% block content %}
<div style="margin-bottom:16px;">
  <a href="/organize" style="color:#0366d6; text-decoration:none;">&larr; Back to Organizer Dashboard</a>
</div>

<h1>Rubric Criterion Weights</h1>
<p style="color:#666;">Define the relative weight of each evaluation criterion (default 1/3 each).</p>

<div class="detail-card" style="max-width:500px;">
  <form method="post" action="/organize/rubric">
    <div class="form-group">
      <label for="functionality">Functionality Weight</label>
      <input type="number" step="any" min="0" max="1" id="functionality" name="functionality" value="{{ rubric.functionality }}" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="quality">Quality Weight</label>
      <input type="number" step="any" min="0" max="1" id="quality" name="quality" value="{{ rubric.quality }}" class="form-control" required>
    </div>

    <div class="form-group">
      <label for="innovation">Innovation Weight</label>
      <input type="number" step="any" min="0" max="1" id="innovation" name="innovation" value="{{ rubric.innovation }}" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary" style="margin-top:10px;">Save Weights</button>
  </form>
</div>
{% endblock %}
